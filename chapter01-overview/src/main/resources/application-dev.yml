# 开发环境配置（使用 H2 内存数据库）
spring:
  datasource:
    url: jdbc:h2:mem:agentscope_tutorial;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台（方便调试，生产环境请禁用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 日志配置
logging:
  level:
    io.agentscope: DEBUG
    org.hibernate.SQL: DEBUG