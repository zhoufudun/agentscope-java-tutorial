# =============================================================================
# AgentScope Java - Chapter 17: Kubernetes Deployment
# 通用资源配置
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: agentscope
  labels:
    app: agentscope
    environment: production
---
# =============================================================================
# ConfigMap: 应用配置
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentscope-config
  namespace: agentscope
  labels:
    app: agentscope
    environment: production
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "prod,k8s"
  # 日志配置
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_IO_AGENTSCOPE: "DEBUG"
  LOG_PATTERN: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  # JVM 参数
  JAVA_OPTS: "-Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
  # 连接池配置
  DB_POOL_SIZE: "20"
  DB_MIN_IDLE: "5"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_IDLE_TIMEOUT: "600000"
  # Redis 配置
  REDIS_POOL_SIZE: "20"
  REDIS_TIMEOUT: "3000"
---
# =============================================================================
# Secret: 敏感信息
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agentscope-secret
  namespace: agentscope
  labels:
    app: agentscope
    environment: production
type: Opaque
stringData:
  # 数据库密码
  DB_PASSWORD: "your-db-password-change-in-production"
  # Redis 密码
  REDIS_PASSWORD: "your-redis-password-change-in-production"
  # DashScope API Key
  DASHSCOPE_API_KEY: "your-dashscope-api-key"
  # Grafana 密码
  GRAFANA_PASSWORD: "admin123"
---
# =============================================================================
# ServiceAccount: 应用服务账号
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentscope-sa
  namespace: agentscope
  labels:
    app: agentscope
---
# =============================================================================
# Role: Pod 读取权限（用于健康检查）
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentscope-role
  namespace: agentscope
  labels:
    app: agentscope
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
# =============================================================================
# RoleBinding
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentscope-rolebinding
  namespace: agentscope
  labels:
    app: agentscope
subjects:
  - kind: ServiceAccount
    name: agentscope-sa
    namespace: agentscope
roleRef:
  kind: Role
  name: agentscope-role
  apiGroup: rbac.authorization.k8s.io