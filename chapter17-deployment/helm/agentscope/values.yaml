# =============================================================================
# AgentScope Java Helm Chart - Values Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Global 配置
# ---------------------------------------------------------------------------
global:
  imageRegistry: docker.io
  imagePullSecrets: []
  storageClass: ""

# ---------------------------------------------------------------------------
# 镜像配置
# ---------------------------------------------------------------------------
image:
  repository: agentscope/chapter17-deployment
  pullPolicy: IfNotPresent
  tag: "1.0.0"
  # 镜像拉取密钥
  pullSecrets: []

# ---------------------------------------------------------------------------
# 应用配置
# ---------------------------------------------------------------------------
replicaCount: 3

# 应用名称和标签
nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod 标签
podLabels: {}

# Pod 注解
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

# ---------------------------------------------------------------------------
# Spring Boot 配置
# ---------------------------------------------------------------------------
spring:
  profiles:
    active: prod
  # 生产配置覆盖
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agentscope}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:agentscope}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AgentScope-HikariCP

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

# ---------------------------------------------------------------------------
# AgentScope 配置
# ---------------------------------------------------------------------------
agentscope:
  model:
    provider: dashscope
  dashscope:
    enabled: true
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-turbo
    stream: true
  agent:
    enabled: true
    name: "Assistant"
    sys-prompt: "你是一个友好的 AI 助手，使用中文回答用户的问题。"
    max-iters: 10

# ---------------------------------------------------------------------------
# 密钥配置（通过 values 设置）
# ---------------------------------------------------------------------------
secret:
  enabled: true
  annotations: {}
  # 数据密码
  dbPassword: "changeme"
  # Redis 密码
  redisPassword: "changeme"
  # DashScope API Key
  dashscopeApiKey: ""

# ---------------------------------------------------------------------------
# 环境变量配置
# ---------------------------------------------------------------------------
env:
  # JVM 参数
  JAVA_OPTS: "-Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError"
  # 日志级别
  LOG_LEVEL_ROOT: INFO
  LOG_LEVEL_IO_AGENTSCOPE: DEBUG
  # 时区
  TZ: Asia/Shanghai

# ---------------------------------------------------------------------------
# 配置映射
# ---------------------------------------------------------------------------
configmap:
  enabled: true
  annotations: {}

# ---------------------------------------------------------------------------
# Service 配置
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  port: 8080
  nodePort: ""  # NodePort 类型时指定
  annotations: {}
  labels: {}
  # 多端口配置
  ports:
    http:
      port: 8080
      targetPort: 8080
      protocol: TCP
    debug:
      port: 5005
      targetPort: 5005
      protocol: TCP

# ---------------------------------------------------------------------------
# Ingress 配置
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  labels: {}
  hosts:
    - host: agentscope.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentscope-tls
      hosts:
        - agentscope.example.com

# ---------------------------------------------------------------------------
# 资源限制
# ---------------------------------------------------------------------------
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

# ---------------------------------------------------------------------------
# 健康检查
# ---------------------------------------------------------------------------
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# ---------------------------------------------------------------------------
# 生命周期钩子
# ---------------------------------------------------------------------------
lifecycle:
  preStop:
    enabled: true
    sleepSeconds: 15

# ---------------------------------------------------------------------------
# 亲和性配置
# ---------------------------------------------------------------------------
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: agentscope
          topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# 污点容忍
# ---------------------------------------------------------------------------
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

# ---------------------------------------------------------------------------
# 节点选择器
# ---------------------------------------------------------------------------
nodeSelector: {}

# ---------------------------------------------------------------------------
# 挂载卷
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  existingClaim: ""

extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# HPA 配置
# ---------------------------------------------------------------------------
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  # CPU 使用率阈值
  cpuThreshold: 70
  # 内存使用率阈值
  memoryThreshold: 80
  # 扩缩容行为
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 0

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# ---------------------------------------------------------------------------
pdb:
  enabled: true
  minAvailable: 2

# ---------------------------------------------------------------------------
# Init 容器
# ---------------------------------------------------------------------------
initContainers:
  waitForMysql:
    enabled: true
    image: busybox:1.36
    command: ["sh", "-c", "until nc -z mysql 3306; do echo 'Waiting for MySQL...'; sleep 5; done"]
  waitForRedis:
    enabled: true
    image: busybox:1.36
    command: ["sh", "-c", "until nc -z redis 6379; do echo 'Waiting for Redis...'; sleep 5; done"]

# ---------------------------------------------------------------------------
# 指标监控 (Prometheus)
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    namespace: monitoring

# ---------------------------------------------------------------------------
# Pod 日志
# ---------------------------------------------------------------------------
logs:
  enabled: true
  emptyDir: true  # true = 使用 emptyDir, false = 使用 PVC

# ---------------------------------------------------------------------------
# 安全上下文
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# 拓扑分布约束（多可用区部署）
# ---------------------------------------------------------------------------
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: agentscope