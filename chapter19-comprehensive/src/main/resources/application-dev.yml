spring:
  application:
    name: chapter19-comprehensive

  # MySQL Production Profile
  datasource:
    url: jdbc:mysql://localhost:3306/agentscope_chapter19?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

# AgentScope Configuration
agentscope:
  api:
    # 未设置环境变量时回退到 demo-key，保证在无真实密钥时也能完成 ReActAgent Bean 的构建
    # （构建阶段仅校验 key 非空，不会发起真实 API 调用）。
    key: ${AGENTSOCOPE_API_KEY:demo-key}
  model:
    name: ${AGENTSCOPE_MODEL_NAME:qwen-max}
    base-url: ${AGENTSCOPE_MODEL_BASE_URL:https://dashscope.aliyuncs.com/api/v1}

# Logging
logging:
  level:
    io.agentscope: INFO
    root: WARN