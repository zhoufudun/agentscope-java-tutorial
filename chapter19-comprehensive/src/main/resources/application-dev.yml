spring:
  application:
    name: chapter19-comprehensive

  # MySQL Production Profile
  datasource:
    url: jdbc:mysql://localhost:3306/agentscope_chapter19?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

# AgentScope Configuration
agentscope:
  api:
    key: ${AGENTSOCOPE_API_KEY:}
  model:
    name: ${AGENTSCOPE_MODEL_NAME:qwen-max}
    base-url: ${AGENTSCOPE_MODEL_BASE_URL:https://dashscope.aliyuncs.com/api/v1}

# Logging
logging:
  level:
    io.agentscope: INFO
    root: WARN