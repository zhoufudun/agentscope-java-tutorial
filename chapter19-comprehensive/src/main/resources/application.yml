spring:
  application:
    name: chapter19-comprehensive

  profiles:
    active: dev

  # H2 Dev Profile
  datasource:
    url: jdbc:h2:mem:chapter19db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

server:
  port: 8080

# AgentScope Configuration
agentscope:
  api:
    key: ${AGENTSOCOPE_API_KEY:demo-key}
  model:
    name: ${AGENTSCOPE_MODEL_NAME:qwen-plus}
    base-url: ${AGENTSCOPE_MODEL_BASE_URL:}

# Logging
logging:
  level:
    io.agentscope: DEBUG
    root: INFO