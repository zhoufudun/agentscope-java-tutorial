micronaut:
  application:
    name: agentscope-micronaut-example
  server:
    port: 8080
    host: 0.0.0.0

# ===================================================================
# AgentScope Configuration
# ===================================================================
agentscope:
  model:
    # Available providers: dashscope, openai, gemini, anthropic
    provider: ${AGENTSCOPE_MODEL_PROVIDER:dashscope}

  # DashScope Configuration (Default)
  dashscope:
    enabled: true
    api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
    model-name: ${DASHSCOPE_MODEL_NAME:qwen-plus}
    stream: false
    enable-thinking: false

  # OpenAI Configuration (Optional)
  openai:
    enabled: false
    api-key: ${OPENAI_API_KEY:}
    model-name: gpt-4-mini
    stream: false

  # Gemini Configuration (Optional)
  gemini:
    enabled: false
    api-key: ${GEMINI_API_KEY:}
    model-name: gemini-2.0-flash
    stream: false

  # Anthropic Configuration (Optional)
  anthropic:
    enabled: false
    api-key: ${ANTHROPIC_API_KEY:}
    model-name: claude-sonnet-4-20250514
    stream: false

  # Agent Configuration
  agent:
    enabled: true
    name: "MicronautAssistant"
    sys-prompt: |
      You are a helpful AI assistant powered by AgentScope,
      running in a Micronaut application.
      Micronaut uses compile-time dependency injection for
      fast startup and low memory usage.
    max-iters: 10

# ===================================================================
# Logging Configuration
# ===================================================================
logger:
  levels:
    io.agentscope: DEBUG
    io.micronaut: INFO