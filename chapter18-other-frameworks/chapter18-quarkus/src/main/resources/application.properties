# ===================================================================
# AgentScope Java - Chapter 18: Quarkus Integration
# Configuration File
# ===================================================================

# ===================================================================
# AgentScope Configuration
# ===================================================================
agentscope.model.provider=${AGENTSCOPE_MODEL_PROVIDER:dashscope}

# DashScope Configuration (Default)
agentscope.dashscope.enabled=true
agentscope.dashscope.api-key=${DASHSCOPE_API_KEY:your-api-key-here}
agentscope.dashscope.model-name=${DASHSCOPE_MODEL_NAME:qwen-plus}
agentscope.dashscope.stream=false
agentscope.dashscope.enable-thinking=false

# OpenAI Configuration (Optional)
#agentscope.model.provider=openai
#agentscope.openai.enabled=false
#agentscope.openai.api-key=${OPENAI_API_KEY:}
#agentscope.openai.model-name=gpt-4-mini
#agentscope.openai.stream=false

# Gemini Configuration (Optional)
#agentscope.model.provider=gemini
#agentscope.gemini.enabled=false
#agentscope.gemini.api-key=${GEMINI_API_KEY:}
#agentscope.gemini.model-name=gemini-2.0-flash
#agentscope.gemini.stream=false

# Anthropic Configuration (Optional)
#agentscope.model.provider=anthropic
#agentscope.anthropic.enabled=false
#agentscope.anthropic.api-key=${ANTHROPIC_API_KEY:}
#agentscope.anthropic.model-name=claude-sonnet-4-20250514
#agentscope.anthropic.stream=false

# Agent Configuration
agentscope.agent.enabled=true
agentscope.agent.name=QuarkusAssistant
agentscope.agent.sys-prompt=You are a helpful AI assistant powered by AgentScope, running in a Quarkus application. Quarkus is designed for cloud-native Java applications with ultra-fast startup and low memory footprint.
agentscope.agent.max-iters=10

# ===================================================================
# Quarkus HTTP Configuration
# ===================================================================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ===================================================================
# Quarkus Logging Configuration
# ===================================================================
quarkus.log.level=INFO
quarkus.log.category."io.agentscope".level=DEBUG
quarkus.log.category."io.quarkus".level=INFO

# ===================================================================
# Quarkus Dev Services (disable for production)
# ===================================================================
quarkus.devservices.enabled=false

# ===================================================================
# Quarkus Native Build Configuration
# ===================================================================
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# ===================================================================
# Quarkus Banner (disable for cleaner output)
# ===================================================================
quarkus.banner.enabled=false