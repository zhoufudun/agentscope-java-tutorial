# 第十二章：计划与任务分解 - 主配置文件
spring:
  application:
    name: chapter12-plan-tutorial

  profiles:
    active: dev

  # H2 Console (开发时方便查看数据)
  h2:
    console:
      enabled: true
      path: /h2-console

# AgentScope 配置
agentscope:
  model:
    # API Key 从环境变量 DASHSCOPE_API_KEY 读取，默认为空（演示模式）
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-plus

# 日志配置
logging:
  level:
    io.agentscope: DEBUG
    io.agentscope.tutorial.chapter12: INFO