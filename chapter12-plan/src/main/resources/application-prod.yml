# 生产环境配置 (MySQL 数据库)
spring:
  config:
    activate:
      on-profile: prod

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plan_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# 服务端口
server:
  port: ${SERVER_PORT:8080}

# 日志
logging:
  level:
    io.agentscope.tutorial.chapter12: INFO
    org.hibernate.SQL: WARN