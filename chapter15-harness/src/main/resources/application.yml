spring:
  application:
    name: chapter15-harness
  datasource:
    url: jdbc:h2:mem:harness_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: INFO
    io.agentscope: DEBUG
    io.agentscope.harness: DEBUG