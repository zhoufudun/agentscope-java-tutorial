# 开发环境配置
spring:
  profiles:
    active: dev

  # H2 数据库配置（可选，用于会话存储）
  datasource:
    url: jdbc:h2:mem:agentscope
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console（开发环境启用）
  h2:
    console:
      enabled: true
      path: /h2-console

# AgentScope 配置
agentscope:
  model:
    api-key: ${DASHSCOPE_API_KEY:EMPTY}
    model-name: ${MODEL_NAME:qwen-plus}
    base-url: ${BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

# 日志配置 - 开发环境更详细
logging:
  level:
    root: INFO
    io.agentscope: TRACE
    io.agentscope.tutorial: TRACE
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"