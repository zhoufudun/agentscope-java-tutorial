# 测试环境配置
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 禁用真实 API 调用（测试时使用模拟）
agentscope:
  dashscope:
    api-key: test-api-key-for-testing-only
  agent:
    enabled: true

# 日志配置
logging:
  level:
    io.agentscope: DEBUG
    org.springframework: INFO