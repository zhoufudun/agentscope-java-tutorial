# 开发环境配置（使用 H2 内存数据库）
spring:
  datasource:
    url: jdbc:h2:mem:agent_sessions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台（方便调试，生产环境请禁用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 日志配置
logging:
  level:
    io.agentscope: DEBUG
    org.springframework: INFO
    org.hibernate: INFO