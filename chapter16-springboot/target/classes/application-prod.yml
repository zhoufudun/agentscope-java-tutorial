# 生产环境配置（使用 MySQL 数据库）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agentscope}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # 禁用 H2 控制台
  h2:
    console:
      enabled: false

  # SQL 初始化（生产环境建议禁用，使用 Flyway/Liquibase）
  sql:
    init:
      mode: never

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# AgentScope 配置
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    model-name: ${DASHSCOPE_MODEL:qwen-plus}

  agent:
    sys-prompt: |
      你是一个专业的AI助手，代号为 TutorialAgent。
      请用中文回答用户的问题。
    max-iters: 10

  chat-completions:
    enabled: true

# 日志配置（生产环境使用 JSON 格式）
logging:
  level:
    root: WARN
    io.agentscope: INFO
    io.agentscope.tutorial: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"