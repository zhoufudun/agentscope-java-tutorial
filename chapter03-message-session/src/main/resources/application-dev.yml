spring:
  # 开发模式使用 H2 内存数据库
  datasource:
    url: jdbc:h2:mem:chatsession_dev;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# 开发模式日志级别
logging:
  level:
    io.agentscope: DEBUG
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE