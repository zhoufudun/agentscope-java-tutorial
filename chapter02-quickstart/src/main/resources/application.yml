# =============================================================================
# AgentScope Java - 第二章：快速开始
# 应用配置文件
# =============================================================================

spring:
  application:
    name: chapter02-quickstart

  # 默认配置（可被环境特定配置覆盖）
  profiles:
    active: dev  # 默认使用 dev 配置

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    root: INFO
    io.agentscope: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"