# Development Profile Configuration
spring:
  # 开发环境数据库配置
  datasource:
    url: jdbc:h2:mem:hitl_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 开发环境 H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # 开发环境 JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# AgentScope 开发配置
agentscope:
  model:
    default: qwen-plus
    stream: true

# 日志配置（开发环境更详细）
logging:
  level:
    io.agentscope: DEBUG
    io.agentscope.tutorial.chapter14: DEBUG
    org.springframework: INFO
    org.hibernate: WARN